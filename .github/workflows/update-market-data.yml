name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4,6,8,10 * * 1-5"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch trending stocks
        env:
          INDIANAPI_KEY: ${{ secrets.INDIANAPI_KEY }}
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            --retry 2 \
            -H "X-API-Key: $INDIANAPI_KEY" \
            "https://stock.indianapi.in/trending" \
            -o data/trending.json

          python -m json.tool data/trending.json > /dev/null

      - name: Remove duplicate stocks
        run: |
          python - <<'PY'
          import json

          path = "data/trending.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          trending = data.get("trending_stocks", {})

          for key in ("top_gainers", "top_losers"):
              stocks = trending.get(key, [])
              unique_stocks = []
              seen = set()

              for stock in stocks:
                  ticker = stock.get("ticker_id")
                  if ticker and ticker in seen:
                      continue
                  if ticker:
                      seen.add(ticker)
                  unique_stocks.append(stock)

              trending[key] = unique_stocks

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Duplicate stocks removed successfully.")

      - name: Save updated market data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update market trending data"
          file_pattern: data/trending.json
